<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563EB">
    <title>FactureFacile — Hors connexion</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #253951; background: #f5f8fc; font: 16px system-ui, sans-serif; text-align: center; }
      main { max-width: 460px; padding: 32px; border: 1px solid #e1e8f0; border-radius: 16px; background: white; box-shadow: 0 12px 35px #1e355a14; }
      h1 { margin-top: 0; } p { color: #64748b; line-height: 1.6; } button { border: 0; border-radius: 8px; padding: 11px 16px; color: white; background: #2563eb; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Vous êtes hors connexion</h1>
      <p>L’application reste installée sur votre appareil. Reconnectez-vous à Internet pour synchroniser vos factures et vos données Supabase.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
